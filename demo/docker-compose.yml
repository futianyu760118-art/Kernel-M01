services:
  m01-kernel:
    build: .
    container_name: aeos-m01-kernel
    ports:
      - "3101:3101"
    environment:
      M01_MODE: "${M01_MODE:-demo}"
      PORT: "3101"
      HOST: "0.0.0.0"
      M01_ADMIN_TOKEN: "${M01_ADMIN_TOKEN:?set M01_ADMIN_TOKEN in .env}"
      M07_WEBHOOK_SECRET: "${M07_WEBHOOK_SECRET:?set M07_WEBHOOK_SECRET in .env}"
      M13_WEBHOOK_SECRET: "${M13_WEBHOOK_SECRET:?set M13_WEBHOOK_SECRET in .env}"
      M01_EBMS_SOURCE_DIR: "${M01_EBMS_SOURCE_DIR:-/data/ebms}"
      M01_EBMS_TENANT_ID: "${M01_EBMS_TENANT_ID:-TENANT_A}"
      M01_EBMS_IMPORT_STATUS: "${M01_EBMS_IMPORT_STATUS:-all}"
      M01_EBMS_IMPORT_ACCOUNT: "${M01_EBMS_IMPORT_ACCOUNT:-all}"
      M01_EBMS_IMPORT_DEPARTMENT: "${M01_EBMS_IMPORT_DEPARTMENT:-}"
    volumes:
      - "../../EBMS-aeos-phase1/database/database:/data/ebms:ro"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: aeos-m01-postgres-test
    environment:
      POSTGRES_USER: m01_test
      POSTGRES_PASSWORD: m01_test
      POSTGRES_DB: m01_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m01_test -d m01_test"]
      interval: 2s
      timeout: 3s
      retries: 20
